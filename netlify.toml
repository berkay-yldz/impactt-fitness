[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 1. SİHİRLİ KÖPRÜ: Emrullah'ın frontend kodlarını kurtaran yönlendirme
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 2. SPA KORUMASI: React Router çökmemsini sağlayan yönlendirme
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200